name: AArch64 CI

on:
  push:
    branches: [ master, main ]
    paths:
      - '**.h'
      - '**.cpp'
      - '**.cc'
      - '**.sh'
      - '**Makefile'
      - '**CMakeLists.txt'
      - '.github/workflows/AArch64.yml'
  pull_request:

env:
  CXX: g++

jobs:
  aarch64:
    # The gcc/clang matrices run in x86-64 container images, so aarch64 gets its
    # own job on the distribution toolchain instead. What it is here for:
    # vir/simd_vecmath.h routes to glibc's AdvSIMD entry points on this
    # architecture, and nothing else in CI compiles that path.
    #
    # AdvSIMD libmvec grew in three steps: 2.38 added sin/cos/exp/log, 2.39
    # added the rest of the trigonometric and logarithmic set, and 2.40 added
    # the hyperbolic set, the error functions and pow. The runner image is on
    # 2.39, which would leave the entire third group uncompiled, so a second job
    # runs the same tests in a newer container to reach it.
    name: AdvSIMD (glibc ${{ matrix.glibc }})
    runs-on: ubuntu-24.04-arm
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - glibc: 2.39, runner image
            container: ''
          - glibc: 2.40+, groups 1-3
            container: 'ubuntu:25.04'

    steps:
      - name: Install toolchain
        if: matrix.container != ''
        run: |
          apt-get update -q
          apt-get install -y -q --no-install-recommends \
            g++ make binutils libc-dev git ca-certificates

      - uses: actions/checkout@v4
        with:
          path: vir-simd

      - name: System info
        run: |
          uname -m
          lscpu || cat /proc/cpuinfo
          ldd --version | head -n1
          $CXX --version | head -n1
          echo "--- libmvec AdvSIMD symbols available to the linker:"
          nm -D --with-symbol-versions /lib/aarch64-linux-gnu/libmvec.so.1 2>/dev/null \
            | grep -cE '_ZGVnN[24]v+_' || echo "no libmvec"

      - name: Routing report
        env:
          CONTAINER: ${{ matrix.container }}
        # Which functions get routed is decided by preprocessor tests against
        # the glibc version, and a wrong guess there fails silently: the call
        # just forwards to the scalar-ish fallback and every test still passes.
        # So derive the expectation from the glibc actually present and let the
        # compiler object if the header disagrees.
        run: |
          set -eu
          glibc=$(ldd --version | head -n1 | grep -oE '[0-9]+\.[0-9]+' | tail -n1)
          major=${glibc%%.*}
          minor=${glibc##*.}
          ge() { [ "$major" -gt 2 ] || { [ "$major" -eq 2 ] && [ "$minor" -ge "$1" ]; }; }
          g1=0; g2=0; g3=0; pw=0
          ge 38 && g1=1 || true
          ge 39 && g2=1 || true
          ge 40 && { g3=1; pw=1; } || true
          echo "glibc $glibc -> expecting group1=$g1 group2=$g2 group3=$g3 pow=$pw"
          if [ -n "${CONTAINER:-}" ] && [ "$g3" -ne 1 ]; then
            echo "::error::this job exists to compile group 3, but $CONTAINER" \
                 "ships glibc $glibc, which does not provide it"
            exit 1
          fi
          cat > routing.cc <<'EOF'
          #include <vir/simd_vecmath.h>
          #include <cstdio>

          #ifndef VIR_HAVE_STD_SIMD
          #  define VIR_HAVE_STD_SIMD 0
          #endif
          #ifndef VIR_HAVE_SIMD_VECMATH
          #  define VIR_HAVE_SIMD_VECMATH 0
          #endif
          #ifndef VIR_VECMATH_GROUP1
          #  define VIR_VECMATH_GROUP1 0
          #endif
          #ifndef VIR_VECMATH_GROUP2
          #  define VIR_VECMATH_GROUP2 0
          #endif
          #ifndef VIR_VECMATH_GROUP3
          #  define VIR_VECMATH_GROUP3 0
          #endif
          #ifndef VIR_VECMATH_HAVE_POW
          #  define VIR_VECMATH_HAVE_POW 0
          #endif

          static_assert(VIR_HAVE_STD_SIMD,
                        "no std::experimental::simd, so nothing here is exercised");
          static_assert(VIR_VECMATH_GROUP1 == EXPECT_G1,
                        "group 1 (sin cos exp log) disagrees with the glibc version");
          static_assert(VIR_VECMATH_GROUP2 == EXPECT_G2,
                        "group 2 (tan asin acos atan atan2 exp2 expm1 log2 log10 log1p)"
                        " disagrees with the glibc version");
          static_assert(VIR_VECMATH_GROUP3 == EXPECT_G3,
                        "group 3 (sinh cosh tanh asinh acosh atanh cbrt erf erfc)"
                        " disagrees with the glibc version");
          static_assert(VIR_VECMATH_HAVE_POW == EXPECT_POW,
                        "pow disagrees with the glibc version");

          int main() {
            std::printf("VIR_HAVE_STD_SIMD     %d\n", VIR_HAVE_STD_SIMD);
            std::printf("VIR_HAVE_SIMD_VECMATH %d\n", VIR_HAVE_SIMD_VECMATH);
            std::printf("VIR_VECMATH_GROUP1    %d\n", VIR_VECMATH_GROUP1);
            std::printf("VIR_VECMATH_GROUP2    %d\n", VIR_VECMATH_GROUP2);
            std::printf("VIR_VECMATH_GROUP3    %d\n", VIR_VECMATH_GROUP3);
            std::printf("VIR_VECMATH_HAVE_POW  %d\n", VIR_VECMATH_HAVE_POW);
          }
          EOF
          $CXX -std=c++17 -O2 -Ivir-simd \
            -DEXPECT_G1=$g1 -DEXPECT_G2=$g2 -DEXPECT_G3=$g3 -DEXPECT_POW=$pw \
            routing.cc -o routing
          ./routing

      - name: Cache test data
        id: cache-testdata
        uses: actions/cache@v4
        with:
          path: vc-testdata
          key: testdata-1
          enableCrossOsArchive: true

      - name: Download test data
        if: steps.cache-testdata.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: VcDevel/vc-testdata
          path: vc-testdata

      - name: Run the vecmath test suite
        # This is what the job gates on. Restricting the test list keeps an
        # unrelated failure elsewhere in the suite from aborting make before
        # these are ever compiled.
        run: |
          cd vir-simd
          make check DRIVEROPTS=-vvf \
            ext_tests="simd_vecmath simd_vecmath_disabled simd_vecmath_no_interposition"

      - name: Run the full test suite (informational)
        # Reported but not gated: the rest of the suite has failures on this
        # platform that predate this workflow. -k so one does not hide the next.
        continue-on-error: true
        run: cd vir-simd && make -k check DRIVEROPTS=-vf
